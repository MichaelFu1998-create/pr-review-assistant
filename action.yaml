name: "PR Code Review"
description: "Agentic LLM code review with static analysis, multi-language support, SARIF output, and learning-oriented scoring."
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  # --- Required ---
  openai_api_key:
    description: "OpenAI API key. Leave empty when using another provider."
    required: false
    default: ""
  github_token:
    description: "GitHub token with PR read/write permissions"
    required: true
  github_pr_id:
    description: "GitHub PR number to review"
    required: true

  # --- Agent settings (v2) ---
  agent_mode:
    description: >-
      'agent' (default: an agent that investigates with tools and can propose
      applyable fixes) or 'pipeline' (the original v1 engine: one single-shot
      LLM call per file, no tools).
    required: false
    default: "agent"
  max_agent_steps:
    description: "Maximum tool-calling turns per agent before it must stop."
    required: false
    default: "25"
  max_agent_tokens:
    description: "Token budget for one review run. Shared across specialists in multi mode."
    required: false
    default: "150000"
  max_agent_seconds:
    description: "Wall-clock limit for one agent, in seconds."
    required: false
    default: "600"
  max_findings:
    description: "Maximum findings recorded per agent."
    required: false
    default: "100"
  suggest_fixes:
    description: >-
      Render high-confidence fixes as GitHub suggested changes, so the author
      gets an Apply button per fix (true/false).
    required: false
    default: "true"

  # --- LLM Settings ---
  llm_provider:
    description: "xai (default), openai, or anthropic"
    required: false
    default: "xai"
  openai_model:
    description: >-
      Model name for whichever provider is selected (e.g. grok-4.6,
      gpt-5.4-mini-2026-03-17, claude-sonnet-4-6). Defaults to grok-4.6.
    required: false
    default: ""
  reasoning_effort:
    description: >-
      Depth/cost dial for reasoning models such as grok-4.6:
      low, medium, high, or xhigh. Empty leaves it to the provider.
    required: false
    default: ""
  openai_temperature:
    description: "Sampling temperature. Dropped automatically if the model rejects it."
    required: false
    default: ""
  openai_max_tokens:
    description: "Maximum tokens per LLM response."
    required: false
    default: ""
  api_base_url:
    description: "Custom base URL for an OpenAI-compatible API (Ollama, vLLM, Azure)"
    required: false
    default: ""
  anthropic_api_key:
    description: "Anthropic API key (required when llm_provider is 'anthropic')"
    required: false
    default: ""
  xai_api_key:
    description: "xAI API key (required when llm_provider is 'xai')"
    required: false
    default: ""

  # --- File Filtering ---
  files:
    description: "Comma-separated glob patterns for files to review (e.g. '*.py,src/*.ts')"
    required: false
    default: ""
  max_files:
    description: "Maximum number of files to review per PR. Empty uses .pr-review.json, else 10."
    required: false
    default: ""

  # --- Static Analysis Tools ---
  tools:
    description: >-
      'auto' (detect from the tech stack), 'none' (LLM only), or a
      comma-separated list. Empty uses .pr-review.json, else 'auto'.
    required: false
    default: ""
  severity_threshold:
    description: "Minimum tool severity to report. Empty uses .pr-review.json, else 'low'."
    required: false
    default: ""

  # --- Review Settings ---
  review_focus:
    description: "security, quality, performance, education, all. Empty uses .pr-review.json, else 'all'."
    required: false
    default: ""
  review_persona:
    description: "normal, mentor, or security-auditor. Empty uses .pr-review.json, else 'normal'."
    required: false
    default: ""
  custom_instructions:
    description: "Extra instructions for the reviewer (e.g. 'We use Django REST Framework')"
    required: false
    default: ""
  enable_scoring:
    description: "Add a 0-25 educational score to the review (true/false)."
    required: false
    default: ""

  # --- Output surfaces (v2) ---
  output_sarif:
    description: >-
      Path to write SARIF to, for github/codeql-action/upload-sarif. Empty
      disables. Requires the 'security-events: write' permission.
    required: false
    default: ""
  output_json:
    description: "Path to write the machine-readable JSON report to. Empty disables."
    required: false
    default: ""
  fail_on:
    description: >-
      Fail the check when findings at this severity or worse exist
      (critical, high, medium, low). Empty never fails.
    required: false
    default: ""

  # --- System ---
  logging:
    description: "Log level: debug, info, warning, error"
    required: false
    default: ""

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    INPUT_OPENAI_API_KEY: ${{ inputs.openai_api_key }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_GITHUB_PR_ID: ${{ inputs.github_pr_id }}
    INPUT_AGENT_MODE: ${{ inputs.agent_mode }}
    INPUT_MAX_AGENT_STEPS: ${{ inputs.max_agent_steps }}
    INPUT_MAX_AGENT_TOKENS: ${{ inputs.max_agent_tokens }}
    INPUT_MAX_AGENT_SECONDS: ${{ inputs.max_agent_seconds }}
    INPUT_MAX_FINDINGS: ${{ inputs.max_findings }}
    INPUT_SUGGEST_FIXES: ${{ inputs.suggest_fixes }}
    INPUT_LLM_PROVIDER: ${{ inputs.llm_provider }}
    INPUT_OPENAI_MODEL: ${{ inputs.openai_model }}
    INPUT_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
    INPUT_OPENAI_TEMPERATURE: ${{ inputs.openai_temperature }}
    INPUT_OPENAI_MAX_TOKENS: ${{ inputs.openai_max_tokens }}
    INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
    INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
    INPUT_XAI_API_KEY: ${{ inputs.xai_api_key }}
    INPUT_FILES: ${{ inputs.files }}
    INPUT_MAX_FILES: ${{ inputs.max_files }}
    INPUT_TOOLS: ${{ inputs.tools }}
    INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
    INPUT_REVIEW_FOCUS: ${{ inputs.review_focus }}
    INPUT_REVIEW_PERSONA: ${{ inputs.review_persona }}
    INPUT_CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
    INPUT_ENABLE_SCORING: ${{ inputs.enable_scoring }}
    INPUT_OUTPUT_SARIF: ${{ inputs.output_sarif }}
    INPUT_OUTPUT_JSON: ${{ inputs.output_json }}
    INPUT_FAIL_ON: ${{ inputs.fail_on }}
    INPUT_LOGGING: ${{ inputs.logging }}
